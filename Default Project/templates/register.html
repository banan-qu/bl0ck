{% extends "base.html" %}
{% block content %}
<div style="text-align: center; margin-top: 50px;">
    <h1 style="font-size: 48px; margin-bottom: 10px; background: linear-gradient(45deg, var(--accent), #ff66cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">bl0ck</h1>
    <p style="color: var(--muted); margin-bottom: 30px;">Мессенджер</p>
</div>
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px; text-align: center;">Регистрация</h2>
    <form method="POST">
        <input type="text" name="login" class="input" placeholder="Логин (для входа)" required>
        <input type="text" name="username" class="input" placeholder="Отображаемое имя" required>
        <input type="password" name="password" class="input" placeholder="Пароль" required>
        <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('login') }}" style="color: var(--accent); text-decoration: none;">Войти</a>
    </div>
</div>
{% endblock %}
